name: "Bug 报告"
description: "白屏、点了没反应、算错了、数据丢了"
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        请先确认：链接是否**完整含 `?sharecode=...`**、是否用的**普通窗口**（不是无痕）、近期有没有清过 Cookie。
        这三项能解决大部分「打不开 / 样式没了 / 按钮没反应」，详见 `AI饮食管家_M4开跑包.md` §7。
  - type: dropdown
    id: where
    attributes:
      label: 出现在哪
      options:
        - 在线演示链接
        - 本地双击 index.html
        - 本地 http://localhost
        - 添加到主屏后的 PWA
        - 不确定 / 多处都有
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 设备与浏览器
      placeholder: 例如：Android 14 / Chrome 120
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 1. 打开… 2. 点击… 3. 看到…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果 / 实际结果
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: 控制台报错（可留空）
      description: 只贴报错文字即可，不要整段粘贴 localStorage 内容
    validations:
      required: false
  - type: dropdown
    id: reset
    attributes:
      label: 是否点过「清空全部数据」或「恢复示例数据」
      options:
        - 没有
        - 点过
        - 不记得
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 提交前确认
      options:
        - label: 我没有粘贴任何真实姓名、手机号、地址或 localStorage / 备份原始数据
          required: true
